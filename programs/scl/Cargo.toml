[package]
name = "scl"
version = "0.1.0"
description = "Solana Compliance Layer - Regulatory compliance middleware for Solana token transfers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "scl"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
solana-program = "~1.18"
constant_time_eq = "=0.3.1"
